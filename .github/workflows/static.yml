# Bygger nettsiden med Jekyll og publiserer den på GitHub Pages.
# Kjører automatisk hver gang noe lagres på main-grenen.
name: Bygg og publiser nettsiden

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent koden
        uses: actions/checkout@v7

      - name: Sett opp Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Sett opp Pages
        id: pages
        uses: actions/configure-pages@v6

      # Adressen avhenger av hvor siden ligger (f.eks. /Aerobot på github.io,
      # eller rett på aerobottechnologies.no). Den hentes automatisk her.
      - name: Bygg med Jekyll
        run: |
          printf 'url: "%s"\nbaseurl: "%s"\n' "${{ steps.pages.outputs.origin }}" "${{ steps.pages.outputs.base_path }}" > _config.pages.yml
          bundle exec jekyll build --config _config.yml,_config.pages.yml
        env:
          JEKYLL_ENV: production

      - name: Last opp siden
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser
        id: deployment
        uses: actions/deploy-pages@v5
